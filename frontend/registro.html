<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta - King Ice Gold">
    <title>Crear Cuenta | King Ice Gold</title>

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@100;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1510 50%, #0a0a0a 100%);
            padding: 2rem 1rem;
        }

        .auth-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo img {
            height: 50px;
        }

        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.25rem;
        }

        .auth-form .form-label {
            display: block;
            color: #ccc;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .auth-form .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            box-sizing: border-box;
        }

        .auth-form .form-input:focus {
            outline: none;
            border-color: var(--color-primary, #d4af37);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .auth-form .form-input::placeholder {
            color: #555;
        }

        .auth-form .form-error {
            color: #ff4444;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            min-height: 1.2em;
        }

        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #d4af37, #b8942e);
            color: #0a0a0a;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 0.5px;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #e5c04a, #c9a533);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #888;
            font-size: 0.85rem;
        }

        .auth-footer a {
            color: var(--color-primary, #d4af37);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-alert {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .auth-alert.success {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #5fdb7e;
            display: block;
        }

        .auth-alert.error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b7a;
            display: block;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #555;
            font-size: 0.8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-divider span {
            padding: 0 1rem;
        }

        .auth-back {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .auth-back:hover {
            color: #999;
        }

        .loader-inline {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html"><img src="images/logo-crown.svg" alt="King Ice Gold"></a>
            </div>

            <h1 class="auth-title">Crear Cuenta</h1>
            <p class="auth-subtitle">Regístrate para comprar más rápido</p>

            <div class="auth-alert" id="alertMsg"></div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="name">Nombre completo</label>
                    <input type="text" class="form-input" id="name" name="name" placeholder="Juan Pérez García">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Correo electrónico *</label>
                    <input type="email" class="form-input" id="email" name="email" required placeholder="tu@email.com">
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Teléfono (WhatsApp) *</label>
                    <input type="tel" class="form-input" id="phone" name="phone" required placeholder="55 1234 5678">
                    <div class="form-error" id="phoneError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña *</label>
                    <input type="password" class="form-input" id="password" name="password" required
                        placeholder="Mínimo 6 caracteres" minlength="6">
                    <div class="form-error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar contraseña *</label>
                    <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" required
                        placeholder="Repite tu contraseña">
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">CREAR MI CUENTA</button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a href="cuenta-login.html">Inicia sesión</a>
            </div>

            <a href="index.html" class="auth-back">← Volver a la tienda</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // If already logged in, redirect
            if (API.CustomerAuth.isLoggedIn()) {
                window.location.href = 'checkout.html';
                return;
            }

            const form = document.getElementById('registerForm');
            const submitBtn = document.getElementById('submitBtn');
            const alertMsg = document.getElementById('alertMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                if (!validateForm()) return;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loader-inline"></span> Creando cuenta...';

                const formData = new FormData(form);

                try {
                    const result = await API.CustomerAuth.register({
                        name: formData.get('name') || '',
                        email: formData.get('email'),
                        phone: formData.get('phone'),
                        password: formData.get('password')
                    });

                    if (result.success) {
                        showAlert('success', '¡Cuenta creada exitosamente! Redirigiendo al inicio de sesión...');
                        submitBtn.disabled = true;

                        setTimeout(() => {
                            const email = formData.get('email');
                            window.location.href = `cuenta-login.html?email=${encodeURIComponent(email)}`;
                        }, 1500);
                    } else {
                        showAlert('error', result.error || 'Error al crear la cuenta');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'CREAR MI CUENTA';
                    }
                } catch (err) {
                    showAlert('error', 'Error de conexión. Intenta de nuevo.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'CREAR MI CUENTA';
                }
            });

            function validateForm() {
                let valid = true;

                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value.replace(/\D/g, '');
                const password = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showError('emailError', 'Ingresa un correo válido');
                    valid = false;
                }

                if (phone.length < 10) {
                    showError('phoneError', 'Ingresa un teléfono de 10 dígitos');
                    valid = false;
                }

                if (password.length < 6) {
                    showError('passwordError', 'Mínimo 6 caracteres');
                    valid = false;
                }

                if (password !== confirm) {
                    showError('confirmPasswordError', 'Las contraseñas no coinciden');
                    valid = false;
                }

                return valid;
            }

            function showError(id, msg) {
                document.getElementById(id).textContent = msg;
            }

            function clearErrors() {
                document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
                alertMsg.className = 'auth-alert';
                alertMsg.style.display = 'none';
            }

            function showAlert(type, msg) {
                alertMsg.className = `auth-alert ${type}`;
                alertMsg.textContent = msg;
                alertMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
