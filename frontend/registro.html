<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta - King Ice Gold">
    <title>Crear Cuenta | King Ice Gold</title>

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@100;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #f5f3ef;
        }

        /* ====== SPLIT LAYOUT ====== */
        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Left: Image panel */
        .login-image {
            flex: 1;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 3rem;
        }

        .login-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('images/hero-bg.jpg') center/cover no-repeat;
            opacity: 0.65;
        }

        .login-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 60%);
        }

        .image-text {
            position: relative;
            z-index: 1;
            color: #fff;
        }

        .image-text h2 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }

        .image-text p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.04em;
        }

        /* Right: Form panel */
        .login-form-panel {
            flex: 0 0 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 3rem;
            background: #fff;
            overflow-y: auto;
        }

        .login-inner {
            width: 100%;
            max-width: 340px;
        }

        /* Logo */
        .login-logo {
            margin-bottom: 2.5rem;
        }

        .login-logo a {
            display: block;
        }

        .login-logo img {
            height: 40px;
        }

        /* Title */
        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 0.4rem;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #ddd;
            background: #fafafa;
            color: #111;
            font-size: 0.92rem;
            font-family: 'M PLUS 2', sans-serif;
            transition: border-color 0.2s;
            border-radius: 0;
            -webkit-appearance: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #111;
            background: #fff;
        }

        .form-input::placeholder {
            color: #bbb;
        }

        .form-error {
            color: #c0392b;
            font-size: 0.75rem;
            margin-top: 0.35rem;
            min-height: 1em;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 0.95rem;
            background: #111;
            color: #fff;
            border: none;
            font-family: 'M PLUS 2', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background: #333;
        }

        .login-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* Alert */
        .auth-alert {
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            margin-bottom: 1.5rem;
            display: none;
            border-radius: 2px;
        }

        .auth-alert.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
            display: block;
        }

        .auth-alert.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            display: block;
        }

        /* Footer */
        .login-links {
            margin-top: 1.8rem;
            text-align: center;
        }

        .login-links p {
            font-size: 0.82rem;
            color: #999;
        }

        .login-links a {
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .login-back {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #bbb;
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .login-back:hover {
            color: #666;
        }

        /* Password toggle */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #555;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* Loader */
        .loader-inline {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 900px) {
            .login-form-panel {
                flex: 0 0 400px;
            }
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }

            .login-image {
                flex: none;
                height: 200px;
                padding: 1.5rem;
                align-items: flex-end;
            }

            .image-text h2 {
                font-size: 1.2rem;
            }

            .login-form-panel {
                flex: 1;
                padding: 2rem 1.5rem;
            }

            .login-inner {
                max-width: 100%;
            }

            .login-logo {
                margin-bottom: 1.5rem;
            }

            .login-title {
                font-size: 1.3rem;
            }

            .login-subtitle {
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .login-form-panel {
                padding: 1.5rem 1.2rem;
            }

            .login-image {
                height: 160px;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <!-- Left: Brand image -->
        <div class="login-image">
            <div class="image-text">
                <h2>Únete a la familia King Ice Gold</h2>
                <p>Acceso exclusivo · Ofertas especiales · Envío prioritario</p>
            </div>
        </div>

        <!-- Right: Registration form -->
        <div class="login-form-panel">
            <div class="login-inner">

                <div class="login-logo">
                    <a href="index.html"><img src="images/logo-crown.svg" alt="King Ice Gold"></a>
                </div>

                <h1 class="login-title">Crear cuenta</h1>
                <p class="login-subtitle">Regístrate para comprar más rápido</p>

                <div class="auth-alert" id="alertMsg"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="name">Nombre completo</label>
                        <input type="text" class="form-input" id="name" name="name" placeholder="Juan Pérez García">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico *</label>
                        <input type="email" class="form-input" id="email" name="email" required
                            placeholder="tu@email.com">
                        <div class="form-error" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">Teléfono (WhatsApp) *</label>
                        <input type="tel" class="form-input" id="phone" name="phone" required placeholder="3332457214"
                            inputmode="numeric" maxlength="10" pattern="[0-9]*">
                        <div class="form-error" id="phoneError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña *</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="password" name="password" required
                                placeholder="Mínimo 8 caracteres" minlength="8">
                            <button type="button" class="toggle-password" data-target="password"
                                aria-label="Mostrar contraseña">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" style="display:none">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                        <div class="form-error" id="passwordError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirmar contraseña *</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                                required placeholder="Repite tu contraseña">
                            <button type="button" class="toggle-password" data-target="confirmPassword"
                                aria-label="Mostrar contraseña">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" style="display:none">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                        <div class="form-error" id="confirmPasswordError"></div>
                    </div>

                    <button type="submit" class="login-btn" id="submitBtn">Crear Mi Cuenta</button>
                </form>

                <div class="login-links">
                    <p>¿Ya tienes cuenta? <a href="cuenta-login.html">Iniciar sesión</a></p>
                    <a href="index.html" class="login-back">← Volver a la tienda</a>
                </div>

            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // If already logged in, redirect
            if (API.CustomerAuth.isLoggedIn()) {
                window.location.href = 'checkout.html';
                return;
            }

            const form = document.getElementById('registerForm');
            const submitBtn = document.getElementById('submitBtn');
            const alertMsg = document.getElementById('alertMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                if (!validateForm()) return;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loader-inline"></span> Creando cuenta...';

                const formData = new FormData(form);

                try {
                    const result = await API.CustomerAuth.register({
                        name: formData.get('name') || '',
                        email: formData.get('email'),
                        phone: formData.get('phone'),
                        password: formData.get('password')
                    });

                    if (result.success) {
                        showAlert('success', '¡Cuenta creada exitosamente! Redirigiendo al inicio de sesión...');
                        submitBtn.disabled = true;

                        setTimeout(() => {
                            const email = formData.get('email');
                            window.location.href = `cuenta-login.html?email=${encodeURIComponent(email)}`;
                        }, 1500);
                    } else {
                        showAlert('error', result.error || 'Error al crear la cuenta');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Crear Mi Cuenta';
                    }
                } catch (err) {
                    showAlert('error', 'Error de conexión. Intenta de nuevo.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Crear Mi Cuenta';
                }
            });

            function validateForm() {
                let valid = true;

                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value.replace(/\D/g, '');
                const password = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showError('emailError', 'Ingresa un correo válido');
                    valid = false;
                }

                if (phone.length !== 10) {
                    showError('phoneError', 'Ingresa exactamente 10 dígitos');
                    valid = false;
                }

                if (password.length < 8) {
                    showError('passwordError', 'Mínimo 8 caracteres');
                    valid = false;
                }

                if (password !== confirm) {
                    showError('confirmPasswordError', 'Las contraseñas no coinciden');
                    valid = false;
                }

                return valid;
            }

            function showError(id, msg) {
                document.getElementById(id).textContent = msg;
            }

            function clearErrors() {
                document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
                alertMsg.className = 'auth-alert';
                alertMsg.style.display = 'none';
            }

            function showAlert(type, msg) {
                alertMsg.className = `auth-alert ${type}`;
                alertMsg.textContent = msg;
                alertMsg.style.display = 'block';
            }

            // Phone: only digits, max 10
            document.getElementById('phone').addEventListener('input', function () {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });

            // Toggle password visibility
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function () {
                    const input = document.getElementById(this.dataset.target);
                    const eyeOpen = this.querySelector('.eye-open');
                    const eyeClosed = this.querySelector('.eye-closed');
                    if (input.type === 'password') {
                        input.type = 'text';
                        eyeOpen.style.display = 'none';
                        eyeClosed.style.display = 'block';
                    } else {
                        input.type = 'password';
                        eyeOpen.style.display = 'block';
                        eyeClosed.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>

</html>
