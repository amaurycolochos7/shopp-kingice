<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión - King Ice Gold">
    <title>Iniciar Sesión | King Ice Gold</title>

    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@100;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1510 50%, #0a0a0a 100%);
            padding: 2rem 1rem;
        }

        .auth-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo img {
            height: 50px;
        }

        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.25rem;
        }

        .auth-form .form-label {
            display: block;
            color: #ccc;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .auth-form .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            box-sizing: border-box;
        }

        .auth-form .form-input:focus {
            outline: none;
            border-color: var(--color-primary, #d4af37);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .auth-form .form-input::placeholder {
            color: #555;
        }

        .auth-form .form-error {
            color: #ff4444;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            min-height: 1.2em;
        }

        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #d4af37, #b8942e);
            color: #0a0a0a;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 0.5px;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #e5c04a, #c9a533);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #888;
            font-size: 0.85rem;
        }

        .auth-footer a {
            color: var(--color-primary, #d4af37);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-alert {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .auth-alert.success {
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #5fdb7e;
            display: block;
        }

        .auth-alert.error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b7a;
            display: block;
        }

        .auth-back {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .auth-back:hover {
            color: #999;
        }

        .loader-inline {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            border-top-color: #0a0a0a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .welcome-msg {
            text-align: center;
            color: #5fdb7e;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html"><img src="images/logo-crown.svg" alt="King Ice Gold"></a>
            </div>

            <h1 class="auth-title">Iniciar Sesión</h1>
            <p class="auth-subtitle">Accede a tu cuenta para comprar</p>

            <div id="welcomeMsg" style="display:none;" class="welcome-msg">
                ✅ ¡Cuenta creada! Ahora inicia sesión con tus credenciales.
            </div>

            <div class="auth-alert" id="alertMsg"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Correo electrónico</label>
                    <input type="email" class="form-input" id="email" name="email" required placeholder="tu@email.com">
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-input" id="password" name="password" required
                        placeholder="Tu contraseña">
                    <div class="form-error" id="passwordError"></div>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">INICIAR SESIÓN</button>
            </form>

            <div class="auth-footer">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>

            <a href="index.html" class="auth-back">← Volver a la tienda</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // If already logged in, redirect
            if (API.CustomerAuth.isLoggedIn()) {
                const redirect = new URLSearchParams(window.location.search).get('redirect');
                window.location.href = redirect ? `${redirect}.html` : 'index.html';
                return;
            }

            // Check if coming from registration
            const params = new URLSearchParams(window.location.search);
            const prefillEmail = params.get('email');
            if (prefillEmail) {
                document.getElementById('email').value = prefillEmail;
                document.getElementById('welcomeMsg').style.display = 'block';
                // Focus password
                document.getElementById('password').focus();
            }

            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const alertMsg = document.getElementById('alertMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email) {
                    showError('emailError', 'Ingresa tu correo');
                    return;
                }
                if (!password) {
                    showError('passwordError', 'Ingresa tu contraseña');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loader-inline"></span> Iniciando sesión...';

                try {
                    const result = await API.CustomerAuth.login(email, password);

                    if (result.success) {
                        showAlert('success', '¡Bienvenido! Redirigiendo...');

                        setTimeout(() => {
                            const redirect = params.get('redirect');
                            window.location.href = redirect ? `${redirect}.html` : 'checkout.html';
                        }, 1000);
                    } else {
                        showAlert('error', result.error || 'Credenciales inválidas');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'INICIAR SESIÓN';
                    }
                } catch (err) {
                    showAlert('error', 'Error de conexión. Intenta de nuevo.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'INICIAR SESIÓN';
                }
            });

            function showError(id, msg) {
                document.getElementById(id).textContent = msg;
            }

            function clearErrors() {
                document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
                alertMsg.className = 'auth-alert';
                alertMsg.style.display = 'none';
            }

            function showAlert(type, msg) {
                alertMsg.className = `auth-alert ${type}`;
                alertMsg.textContent = msg;
                alertMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
