# =====================================================
# KING ICE GOLD - Docker Compose para Dokploy
# =====================================================

services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  king-ice-gold-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: kingicegold
      POSTGRES_USER: kingice
      POSTGRES_PASSWORD: ${DB_PASSWORD:-KingIce2026Prod!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/supabase_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingice -d kingicegold"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - king-ice-gold-internal

  # =====================================================
  # Backend API + Frontend (Node.js + Express)
  # Usa el Dockerfile raíz que incluye el frontend estático
  # =====================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      king-ice-gold-db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://kingice:${DB_PASSWORD:-KingIce2026Prod!}@king-ice-gold-db:5432/kingicegold
      JWT_SECRET: ${JWT_SECRET:-kingice-change-this-in-production}
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: ${FRONTEND_URL:-https://kingicegold.com.mx}
    ports:
      - "4000:4000"
    networks:
      - king-ice-gold-internal
      - dokploy-network

networks:
  king-ice-gold-internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
